<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales Pipeline • Bauer Roofing Operations</title><link rel="stylesheet" href="styles.css?v=20260910-7"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260910-7"></script><style>body{background:#f3f6f9}.sales-shell{width:min(1580px,97vw);margin:18px auto 50px}.sales-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.sales-head h1{margin:0 0 4px}.sales-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}.sales-tools input{min-width:280px;margin:0}.sales-tools label{display:flex;align-items:center;gap:6px;font-size:13px}.sales-top-scroll{height:18px;overflow-x:auto;overflow-y:hidden;position:sticky;top:38px;z-index:970;background:#f3f6f9;margin:0 0 7px;border-radius:7px}.sales-top-scroll-inner{height:1px}.pipeline{display:grid;grid-template-columns:repeat(6,minmax(230px,1fr));gap:9px;overflow-x:auto;padding-bottom:14px;align-items:start}.pipe-col{border-radius:12px;padding:8px;min-height:520px;transition:.12s}.pipe-col.drop-target{outline:3px solid rgba(31,111,213,.35);transform:translateY(-2px)}.pipe-head{font-weight:800;padding:8px 6px 10px;position:static;border-radius:8px;background:inherit}.pipe-head small{display:block;color:#687588;font-weight:500;margin-top:2px}.p-appointment{background:#e4f7e9}.p-estneed{background:#fff3d7}.p-estsent{background:#f1e9ff}.p-follow{background:#fff0e3}.p-sold{background:#e3f8f6}.p-rejected{background:#f6e8e8}.sales-card{background:#fff;border:1px solid #dfe5ec;border-radius:9px;padding:10px;margin-bottom:8px;box-shadow:0 1px 4px rgba(24,39,61,.06);cursor:pointer;user-select:none}.sales-card:hover{box-shadow:0 2px 8px rgba(24,39,61,.13);border-color:#c7d4e3}.sales-card:active{cursor:grabbing}.sales-card.dragging{opacity:.45}.sales-card.card-overdue{border-color:#d98989;box-shadow:0 0 0 2px rgba(180,45,45,.08)}.card-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:7px}.card-title-row b{display:block;min-width:0}.time-badge{flex:0 0 auto;font-size:9px;font-weight:800;letter-spacing:.03em;padding:3px 5px;border-radius:999px;background:#edf1f5;color:#526171}.today-badge{background:#d8ecff;color:#075aa7}.meta{font-size:12px;color:#687588;margin-top:2px}.important{font-size:12px;font-weight:700;margin-top:5px}.danger-text{color:#a52222}.next-action{margin-top:7px;padding:6px 7px;border-radius:7px;background:#f6f8fa;font-size:11px;font-weight:700;color:#33465d}.card-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.card-actions a,.card-actions button{font-size:11px;padding:4px 7px;border:1px solid #d9e1ea;border-radius:7px;background:#fff;text-decoration:none;color:#30445e;cursor:pointer}.card-actions button:hover,.card-actions a:hover{background:#edf4fb}.empty{color:#687588;font-size:12px;padding:12px 5px}.ctx{position:fixed;z-index:5000;min-width:220px;background:#fff;border:1px solid #cfd8e3;border-radius:9px;box-shadow:0 10px 28px rgba(20,35,55,.18);padding:5px;display:none}.ctx button{display:block;width:100%;border:0;background:#fff;text-align:left;padding:8px 9px;border-radius:6px;cursor:pointer}.ctx button:hover{background:#eef4fb}.outcome-dialog{min-width:min(520px,92vw);margin:0}.notice.hidden{display:none!important}@media(max-width:800px){.sales-head{display:flex}.pipeline{grid-template-columns:repeat(6,215px)}.sales-tools input{min-width:190px}.sales-top-scroll{top:34px}.card-actions a,.card-actions button{font-size:10px;padding:4px 6px}}</style></head><body><main class="sales-shell"><div class="sales-head"><div><h1>Sales Pipeline</h1><div class="sub">Sales begins when the appointment is set. Past appointments without a job move to Estimate Needed.</div></div><a class="btn" href="index.html">Back to Operations</a></div><div id="salesNotice" class="notice hidden"></div><div class="sales-tools"><input id="salesSearch" type="search" placeholder="Search name, lead #, address, phone..."><label><input id="showClosed" type="checkbox"> Show Sold / Rejected</label><button class="btn small" id="refreshSales">Refresh</button></div><div id="salesTopScroll" class="sales-top-scroll"><div id="salesTopScrollInner" class="sales-top-scroll-inner"></div></div><div id="salesBoard" class="pipeline"><section class="pipe-col p-appointment"><div class="pipe-head">Appointment<small>Loading…</small></div></section><section class="pipe-col p-estneed"><div class="pipe-head">Estimate Needed<small>Loading…</small></div></section><section class="pipe-col p-estsent"><div class="pipe-head">Estimate Sent<small>Loading…</small></div></section><section class="pipe-col p-follow"><div class="pipe-head">Follow Up<small>Loading…</small></div></section><section class="pipe-col p-sold"><div class="pipe-head">Sold<small>Loading…</small></div></section><section class="pipe-col p-rejected"><div class="pipe-head">Rejected<small>Loading…</small></div></section></div></main><div id="salesContext" class="ctx"></div><dialog id="outcomeDialog"><form method="dialog" class="card outcome-dialog"><h2>Appointment Result</h2><input id="outcomeLeadId" type="hidden"><label>Result</label><select id="outcomeResult"><option>Estimate needed</option><option>Estimate sent/given</option><option>Another appointment needed</option><option>Another professional needs to look at work</option><option>Contract signed</option><option>Customer thinking/follow up</option><option>Not interested</option><option>Reschedule</option><option>Other</option></select><label>Note</label><textarea id="outcomeNote" rows="3"></textarea><div class="toolbar"><button class="btn primary" type="button" id="saveOutcome">Save Result</button><button class="btn" value="cancel">Cancel</button></div></form></dialog><script src="sales-board-v2.js?v=20260910-7"></script></body></html>
