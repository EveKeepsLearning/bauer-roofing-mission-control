<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bauer Roofing - Appointment Update</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    :root{
      --bg:#f5f7fa;
      --card:#fff;
      --text:#202124;
      --muted:#5f6368;
      --line:#dadce0;
      --blue:#1a73e8;
      --green:#188038;
      --green-bg:#e6f4ea;
      --amber:#b06000;
      --amber-bg:#fef7e0;
    }
    *{box-sizing:border-box}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
    }
    .wrap{max-width:620px;margin:0 auto;padding:18px}
    .brand{font-size:15px;font-weight:700;color:var(--muted);margin-bottom:10px}
    .card{
      background:var(--card);border:1px solid var(--line);
      border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);
    }
    h1{font-size:24px;margin:0 0 6px}
    .sub{color:var(--muted);line-height:1.4;margin-bottom:18px}
    .progress{
      height:8px;background:#e8eaed;border-radius:10px;overflow:hidden;margin-bottom:18px;
    }
    .progress > div{height:100%;background:var(--blue);width:0;transition:width .2s}
    .appt{
      border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:16px;background:#fff;
    }
    .appt-time{font-size:13px;color:var(--blue);font-weight:700}
    .appt-title{font-size:19px;font-weight:700;margin-top:4px}
    .appt-meta{color:var(--muted);margin-top:5px;line-height:1.45}
    .question{font-size:18px;font-weight:700;margin:20px 0 10px}
    .outcomes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    button{
      font:inherit;border:1px solid var(--line);background:#fff;
      border-radius:12px;padding:14px 12px;cursor:pointer;text-align:left;
    }
    button:hover{background:#f8f9fa}
    button.selected{border-color:var(--blue);box-shadow:0 0 0 2px #d2e3fc inset}
    textarea{
      width:100%;min-height:88px;border:1px solid var(--line);
      border-radius:10px;padding:11px;font:inherit;margin-top:12px;
    }
    .actions{display:flex;gap:10px;margin-top:14px}
    .primary{
      background:var(--blue);color:#fff;border-color:var(--blue);
      text-align:center;font-weight:700;flex:1;
    }
    .primary:disabled{opacity:.55;cursor:not-allowed}
    .secondary{text-align:center}
    .notice{
      border-radius:10px;padding:13px;margin-bottom:14px;
      background:var(--amber-bg);color:#7a4300;border:1px solid #f5d481;
    }
    .success{
      background:var(--green-bg);color:#0d652d;border:1px solid #a8dab5;
      border-radius:12px;padding:18px;text-align:center;
    }
    .hidden{display:none!important}
    .done-title{font-size:24px;font-weight:800;margin-bottom:8px}
    .small{font-size:13px;color:var(--muted)}
    @media(max-width:520px){
      .wrap{padding:12px}
      .outcomes{grid-template-columns:1fr}
      h1{font-size:22px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Bauer Roofing</div>

    <div id="loadingCard" class="card">
      Loading today's appointments…
    </div>

    <div id="errorCard" class="notice hidden"></div>

    <div id="appCard" class="card hidden">
      <h1>Quick appointment update</h1>
      <div class="sub" id="introText">Just tap what happened. This should take less than a minute.</div>

      <div class="progress"><div id="progressBar"></div></div>
      <div class="small" id="progressText"></div>

      <div id="appointmentArea"></div>

      <div class="question">What happened?</div>
      <div class="outcomes" id="outcomes"></div>

      <textarea id="note" placeholder="Optional note — only if Eve needs to know something"></textarea>

      <div class="actions">
        <button class="primary" id="saveBtn" disabled>Save & Next</button>
      </div>
    </div>

    <div id="doneCard" class="success hidden">
      <div class="done-title">Done — thank you.</div>
      <div id="doneText">Eve has your updates.</div>
    </div>
  </div>

<script>
'use strict';

const cfg = window.BAUER_CONFIG || {};
const db = supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);

const APPOINTMENT_OUTCOMES = [
  'Estimate needed',
  'Estimate sent / given',
  'Another appointment needed',
  'Another professional needs to look at the work',
  'Contract signed',
  'Customer thinking / follow up',
  'Not interested',
  'Reschedule',
  'Other'
];

const ESTIMATE_OUTCOMES = [
  'Estimate sent today',
  'Still working on it',
  'Another professional needs to look at the work',
  'Customer follow up needed'
];

let token = null;
let items = [];
let index = 0;
let selectedOutcome = '';

const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

function timeText(value){
  return new Intl.DateTimeFormat('en-US',{
    timeZone:'America/New_York',
    hour:'numeric',
    minute:'2-digit'
  }).format(new Date(value));
}

function renderOutcomeButtons(){
  const choices = items[index]?.item_type === 'estimate'
    ? ESTIMATE_OUTCOMES
    : APPOINTMENT_OUTCOMES;

  $('outcomes').innerHTML = choices.map(outcome=>
    '<button type="button" data-outcome="'+esc(outcome)+'">'+esc(outcome)+'</button>'
  ).join('');
}

function render(){
  if(index>=items.length){
    $('appCard').classList.add('hidden');
    $('doneCard').classList.remove('hidden');
    $('doneText').textContent = items.length
      ? 'All '+items.length+' appointment update'+(items.length===1?' is':'s are')+' complete.'
      : 'There were no sales appointments waiting for an update.';
    return;
  }

  const item=items[index];

  $('progressText').textContent=(index+1)+' of '+items.length;
  $('progressBar').style.width=((index/items.length)*100)+'%';

  const isEstimate = item.item_type === 'estimate';
  const homeowner = isEstimate
    ? (item.homeowner_name || [item.first_name,item.last_name].filter(Boolean).join(' '))
    : [item.contact_first_name,item.contact_last_name].filter(Boolean).join(' ');
  const address = isEstimate ? (item.street_address || '') : (item.property_text || '');
  const leadNumber = isEstimate ? item.lead_number : item.matched_lead_number;
  const leadLabel=leadNumber ? 'Lead # '+leadNumber : '';

  $('appointmentArea').innerHTML=`
    <div class="appt">
      <div class="appt-time">${isEstimate ? 'PAST ESTIMATE CHECK' : esc(timeText(item.start_at))+' - '+esc(timeText(item.end_at))}</div>
      <div class="appt-title">${esc(homeowner || item.summary || 'Appointment')}</div>
      <div class="appt-meta">
        ${address ? esc(address)+'<br>' : ''}
        ${isEstimate ? 'Estimate is still pending' : (item.appointment_type ? esc(item.appointment_type) : '')}
        ${leadLabel ? ' • '+esc(leadLabel) : ''}
      </div>
    </div>
  `;

  selectedOutcome='';
  $('note').value='';
  $('saveBtn').disabled=true;
  $('note').placeholder = isEstimate
    ? 'Optional note — for example, what is holding up the estimate'
    : 'Optional note — only if Eve needs to know something';
  $('saveBtn').textContent = index === items.length - 1 ? 'Save & Finish' : 'Save & Next';
  renderOutcomeButtons();
}

async function saveCurrent(){
  if(!selectedOutcome || index>=items.length) return;

  const item=items[index];
  const button=$('saveBtn');
  button.disabled=true;
  button.textContent='Saving…';

  const request = item.item_type === 'estimate'
    ? db.rpc('save_roy_estimate_update',{
        p_token:token,
        p_lead_id:item.lead_id,
        p_outcome:selectedOutcome,
        p_note:$('note').value.trim() || null
      })
    : db.rpc('save_roy_appointment_outcome',{
        p_token:token,
        p_calendar_event_id:item.calendar_event_id,
        p_outcome:selectedOutcome,
        p_note:$('note').value.trim() || null
      });

  const {error}=await request;

  if(error){
    alert('Could not save the update. Please try again.');
    button.disabled=false;
    return;
  }

  index++;
  render();
}

async function start(){
  token=new URLSearchParams(window.location.search).get('token');

  if(!token){
    $('loadingCard').classList.add('hidden');
    $('errorCard').textContent='This update link is missing its secure token.';
    $('errorCard').classList.remove('hidden');
    return;
  }

  const [appointmentResult,estimateResult]=await Promise.all([
    db.rpc('get_roy_update_appointments',{p_token:token}),
    db.rpc('get_roy_pending_estimates',{p_token:token})
  ]);

  $('loadingCard').classList.add('hidden');

  if(appointmentResult.error || estimateResult.error){
    $('errorCard').textContent='This update link is invalid or has expired.';
    $('errorCard').classList.remove('hidden');
    return;
  }

  items=[
    ...(appointmentResult.data || []).map(item=>({...item,item_type:'appointment'})),
    ...(estimateResult.data || []).map(item=>({...item,item_type:'estimate'}))
  ];

  if(!items.length){
    $('doneCard').classList.remove('hidden');
    $('doneText').textContent='There are no sales appointments waiting for an update.';
    return;
  }

  $('appCard').classList.remove('hidden');
  render();
}

$('saveBtn').onclick=saveCurrent;
$('outcomes').addEventListener('click',e=>{
  const btn=e.target.closest('[data-outcome]');
  if(!btn) return;
  selectedOutcome=btn.dataset.outcome;
  document.querySelectorAll('[data-outcome]').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  $('saveBtn').disabled=false;
});
start();
</script>
</body>
</html>
