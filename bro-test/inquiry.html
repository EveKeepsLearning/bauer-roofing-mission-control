<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inquiry • Bauer Roofing Operations</title><link rel="stylesheet" href="styles.css?v=20260910-22"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260910-22"></script><style>body{background:#f3f6f9}.shell{width:min(1100px,94vw);margin:24px auto 60px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.head h1{margin-bottom:4px}.card2{background:#fff;border:1px solid #dfe5ec;border-radius:14px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.appt{border:1px solid #e1e7ee;border-radius:10px;padding:12px;margin:8px 0;cursor:pointer;background:#fbfcfd}.appt:hover{background:#f4f8fd}.appt-grid{display:grid;grid-template-columns:180px 1fr 160px;gap:12px}.toolbar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.empty{text-align:center;color:#687588;padding:24px}.customer-summary{display:grid;grid-template-columns:minmax(260px,1.2fr) minmax(300px,1fr) auto;gap:18px;align-items:center;background:#fff;border:1px solid #d9e2ec;border-radius:14px;padding:16px 18px;margin-top:14px;box-shadow:0 1px 4px rgba(24,39,61,.05)}.customer-kicker{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#5c6f84}.customer-name{font-size:23px;font-weight:800;color:#22344c;margin-top:2px}.customer-address{font-size:13px;color:#617184;margin-top:3px}.customer-contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}.customer-contact-grid div{min-width:0}.customer-contact-grid span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#7b8897}.customer-contact-grid a,.customer-contact-grid b{font-size:13px;overflow-wrap:anywhere}.customer-quick-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.danger{background:#fff0f0!important;border-color:#e3a5a5!important;color:#8b1f1f!important}@media(max-width:760px){.head,.grid,.appt-grid{display:block}.wide{grid-column:auto}.customer-summary{grid-template-columns:1fr;gap:10px}.customer-contact-grid{grid-template-columns:1fr 1fr}.customer-quick-actions{justify-content:flex-start}.customer-name{font-size:20px}}</style></head><body><main class="shell"><div class="head"><div><h1 id="title">Inquiry</h1><div class="sub" id="subtitle"></div></div><div class="toolbar2"><button class="btn" id="backBtn" type="button">Back to Contact</button><button class="btn" id="jobBtn" type="button" style="display:none">Open Job</button></div></div><div id="customerSummary" class="customer-summary"><div class="customer-summary-main"><div class="customer-kicker">Loading inquiry…</div><div class="customer-name">Customer</div></div></div><div id="notice" class="notice hidden"></div><section class="card2"><div class="grid"><div><label>Inquiry number</label><input id="leadNumber"></div><div><label>Inquiry date/time</label><input id="inquiryAt" type="datetime-local"></div><div><label>Inquiry taken by</label><input id="takenBy"></div><div><label>Assigned to</label><input id="assignedTo"></div><div><label>Lead source primary</label><input id="source"></div><div><label>Lead source secondary</label><input id="sourceSecondary"></div><div><label>Product interest</label><input id="productInterest" placeholder="Roofing (Asphalt), Metal Roofing, Repairs, Windows..."></div><div><label>Product description</label><input id="productDescription"></div><div><label>Work category</label><input id="workCategory"></div><div><label>Phone</label><input id="phone"></div><div><label>Email</label><input id="email"></div><div class="wide"><label>Property address</label><input id="address"></div><div><label>City</label><input id="city"></div><div><label>State</label><input id="state"></div><div><label>ZIP</label><input id="zip"></div><div class="wide"><label>Notes</label><textarea id="notes" rows="5"></textarea></div></div><div class="toolbar" style="margin-top:16px"><button class="btn primary" id="saveInquiryBtn" type="button">Save Inquiry</button></div></section><section class="card2"><div class="head"><div><h2 style="margin:0">Appointments</h2><div class="sub">Appointments tied to this inquiry. Click one to edit it.</div></div><button class="btn primary" id="addAppointmentBtn" type="button">+ Add Appointment</button></div><div id="appointmentList"></div></section></main><dialog id="appointmentDialog"><form method="dialog" class="card" style="min-width:min(760px,94vw)"><h2 id="appointmentTitle">Appointment</h2><input id="appointmentId" type="hidden"><div class="grid"><div><label>Date/time</label><input id="appointmentAt" type="datetime-local"></div><div><label>Assigned to</label><input id="appointmentAssigned"></div><div><label>Appointment type</label><input id="appointmentType"></div><div><label>Result</label><input id="appointmentResult" placeholder="Demo Sold, Estimate Needed, Reschedule..."></div><div class="wide"><label>Result reason / note</label><input id="appointmentResultNote"></div><div class="wide"><label>Notes</label><textarea id="appointmentNotes" rows="4"></textarea></div></div><div class="toolbar"><button class="btn primary" id="saveAppointmentBtn" type="button">Save Appointment</button><button class="btn" value="cancel">Cancel</button></div></form></dialog><script src="inquiry-dropdowns.js?v=20260910-22"></script><script src="inquiry.js?v=20260910-22"></script><script src="legacy-prelead-display.js?v=20260910-41"></script><script src="inquiry-appointment-actions.js?v=20260910-22"></script><script src="sticky-actions.js?v=20260910-31"></script></body></html>
