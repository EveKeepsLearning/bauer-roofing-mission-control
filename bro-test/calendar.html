<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bauer Roofing Operations - Calendar</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=20260911-54-test"></script>
  <style>
    :root{--line:#dfe5ec;--muted:#697789;--blue:#1a73e8;--green:#188038;--repair:#4054b2;--reroof:#1296d4;--hour:52px}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f9fb;color:#223044}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;cursor:pointer;text-decoration:none;color:#334155}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.small{padding:5px 9px;font-size:12px}.toolbar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}.toolbar .period{font-size:17px;margin-left:8px}.spacer{flex:1}.status{font-size:12px;color:var(--muted)}.status.ok{color:var(--green)}.status.error{color:#b3261e}.calendar-shell{height:calc(100vh - 90px);overflow:auto;background:#fff}.calendar-grid{min-width:1080px;display:grid;grid-template-columns:64px 1fr;position:relative}.day-heads{position:sticky;top:0;z-index:20;grid-column:2;display:grid;grid-template-columns:repeat(7,1fr);background:#fff;border-bottom:1px solid var(--line)}.day-head{text-align:center;padding:8px 4px;color:var(--muted)}.day-head b{display:block;font-size:20px;color:#1f2937;margin-top:2px}.day-head.today b{display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;background:var(--blue);color:#fff;border-radius:50%}.times{grid-column:1;position:sticky;left:0;z-index:15;background:#fff;border-right:1px solid var(--line)}.time{height:var(--hour);text-align:right;padding:0 8px;color:var(--muted);font-size:11px;transform:translateY(-6px)}.day-cols{grid-column:2;display:grid;grid-template-columns:repeat(7,1fr);position:relative;height:calc(var(--hour)*14)}.day-col{position:relative;border-right:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour) - 1px),#e9edf2 calc(var(--hour) - 1px),#e9edf2 var(--hour))}.cal-event{position:absolute;left:4px;right:4px;border:0;border-radius:6px;padding:5px 7px;text-align:left;color:#fff;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.15)}.cal-event.repair{background:var(--repair)}.cal-event.reroof{background:var(--reroof)}.cal-event b,.cal-event span{display:block;font-size:11px;line-height:1.25}.cal-event b{font-size:12px}.cal-event i{position:absolute;right:5px;top:5px;font-style:normal;background:#fff;color:var(--green);width:17px;height:17px;border-radius:50%;text-align:center;font-weight:800}.cal-event.matched{outline:2px solid rgba(24,128,56,.55);outline-offset:-2px}
    dialog{border:0;border-radius:14px;padding:0;width:min(820px,94vw);max-height:88vh;box-shadow:0 20px 60px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(15,23,42,.35)}.dialog-card{padding:20px;overflow:auto;max-height:88vh}.dialog-head{display:flex;gap:12px;align-items:flex-start}.dialog-head h2{margin:0 0 4px;font-size:21px}.dialog-head .sub{color:var(--muted)}.detail-grid{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;margin-top:16px;font-size:14px}.detail-label{color:var(--muted)}.match-card,.matched-box{margin-top:18px;border:1px solid var(--line);border-radius:10px;padding:14px;background:#fafbfd}.match-card.exact{border-color:#99c8a7;background:#f1fbf4}.matched-box{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:center;border-color:#9fd3ae;background:#effaf2}.matched-box b{display:block}.eyebrow{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:800;margin-bottom:3px}.search-box{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.search-row{display:flex;gap:8px}.search-row input{flex:1;padding:9px 10px;border:1px solid #cfd8e3;border-radius:8px}.search-results{margin-top:10px;display:grid;gap:8px;max-height:280px;overflow:auto}.search-result{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}.search-result div div{font-size:12px;color:var(--muted);margin-top:2px}.muted{color:var(--muted);font-size:13px}.error-box{color:#b3261e;background:#fff3f2;border:1px solid #f3b3ae;padding:10px;border-radius:8px}.dialog-actions{display:flex;justify-content:flex-end;margin-top:18px}@media(max-width:700px){.matched-box{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}.toolbar .period{display:none}.status{display:none}}
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="btn" id="todayBtn">Today</button><button class="btn" id="prevBtn">‹</button><button class="btn" id="nextBtn">›</button>
    <div class="period" id="periodTitle">Calendar</div><div class="spacer"></div><div class="status" id="status"></div><button class="btn" id="createRoyLinkBtn" type="button">Roy Daily Check-Off</button><button class="btn primary" id="syncBtn">Sync</button>
  </div>
  <div class="calendar-shell"><div class="calendar-grid"><div></div><div class="day-heads" id="dayHeads"></div><div class="times" id="times"></div><div class="day-cols" id="dayCols"></div></div></div>
  <dialog id="eventDialog"><div class="dialog-card"><div class="dialog-head"><div><h2 id="eventTitle">Appointment</h2><div class="sub" id="eventWhen"></div></div></div><div class="detail-grid" id="eventContact"></div><div id="matchArea"></div><div class="search-box"><b>Find Contact / Inquiry</b><div class="muted">Search the current BRO customer records by name, spouse, phone, email, address, or inquiry number.</div><div class="search-row"><input id="searchInput" placeholder="Search Contacts and Inquiries"><button class="btn primary" id="searchBtn">Search</button></div><div class="search-results" id="searchResults"></div></div><div class="dialog-actions"><button class="btn" id="closeDialog">Close</button></div></div></dialog>
  <script>(function(){const box=document.getElementById('times');for(let h=7;h<=20;h++){const d=document.createElement('div');d.className='time';const hr=h%12||12;d.textContent=`${hr} ${h<12?'AM':'PM'}`;box.appendChild(d);}})();</script>
  <script id="calendarSyncClientScript" src="calendar-sync-client-v2.js?v=20260911-54-test"></script>
  <script src="calendar-sync-recovery.js?v=20260911-54-test"></script>
  <script src="calendar-v4.js?v=20260911-54-test"></script>
  <script src="calendar-google-view.js?v=20260911-54-test"></script>
  <script>
    (function(){
      const button=document.getElementById('createRoyLinkBtn');
      if(!button||!window.supabase)return;
      const cfg=window.BAUER_CONFIG||{};
      const db=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
      button.addEventListener('click',async()=>{
        const original=button.textContent;
        button.disabled=true;
        button.textContent='Creating…';
        try{
          const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
          const value=type=>parts.find(part=>part.type===type)?.value||'';
          const today=`${value('year')}-${value('month')}-${value('day')}`;
          const {data,error}=await db.rpc('create_roy_update_session',{p_update_date:today});
          if(error)throw error;
          const token=Array.isArray(data)?data[0]?.token:(data?.token||data);
          if(!token)throw new Error('Bauer Roofing Operations did not receive a daily check-off token.');
          const url=new URL('roy-update.html',window.location.href);
          url.searchParams.set('token',token);
          try{await navigator.clipboard.writeText(url.toString());alert("Roy's daily check-off link has been copied.\n\nPaste it into a text message to Roy after his appointments.");}
          catch(copyError){prompt('Copy this link and text it to Roy:',url.toString());}
        }catch(error){console.error(error);alert('Could not create Roy’s daily check-off link: '+(error.message||String(error)));}
        finally{button.disabled=false;button.textContent=original;}
      });
    })();
  </script>
</body>
</html>
