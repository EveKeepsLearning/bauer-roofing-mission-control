<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Inquiry • Bauer Roofing Operations</title><link rel="stylesheet" href="styles.css?v=20260911-51-test"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260911-51-test"></script><style>body{background:#f3f6f9}.shell{width:min(1180px,94vw);margin:22px auto 50px}.head{display:flex;justify-content:space-between;gap:14px;align-items:center}.cardx{background:#fff;border:1px solid #dfe5ec;border-radius:12px;margin-top:14px;overflow:hidden}.sec{padding:16px 18px;border-bottom:1px solid #e7ebf0}.sec h3{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px 12px}.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:1/-1}label{display:block;font-size:11px;font-weight:700;color:#637286;margin-bottom:4px}input,select,textarea{width:100%;box-sizing:border-box}.actions{position:sticky;bottom:0;z-index:10;background:#fff;padding:12px 18px;border-top:1px solid #dfe5ec;display:flex;gap:8px;align-items:center}.status{font-size:12px;color:#667589;margin-left:auto}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.span3,.span4{grid-column:1/-1}}@media(max-width:540px){.grid{grid-template-columns:1fr}.span2,.span3,.span4{grid-column:auto}}</style></head><body><main class="shell"><div class="head"><div><h1 style="margin:0">Contact + Inquiry</h1><div class="sub">Full Bauer Roofing lead-sheet intake.</div></div><a class="btn" href="contacts.html">Cancel</a></div><div id="notice" class="notice hidden"></div><form id="form" class="cardx"><section class="sec"><h3>Customer & Inquiry</h3><div class="grid"><div><label>Inquiry / Lead #</label><input id="leadNumber" autocomplete="off"><div id="leadSuggestion" class="sub" style="margin-top:5px">Checking next number…</div></div><div><label>Lead date</label><input id="leadDate" type="date"></div><div><label>Taken by</label><input id="takenBy" value="Eve"></div><div><label>Salesperson</label><input id="assignedTo" value="Roy"></div><div class="span2"><label>Name / Company</label><input id="homeownerName" required></div><div class="span2"><label>Spouse / Co-Owner</label><input id="spouseName"></div><div><label>First name</label><input id="firstName"></div><div><label>Last name</label><input id="lastName"></div><div><label>Phone</label><input id="phone"></div><div><label>Other phone</label><input id="phoneSecondary"></div><div class="span2"><label>Email</label><input id="email" type="email"></div></div></section><section class="sec"><h3>Job Address</h3><div class="grid"><div class="span2"><label>Street address</label><input id="street"></div><div><label>City</label><input id="city"></div><div><label>State</label><input id="state" value="SC"></div><div><label>ZIP</label><input id="zip"></div><div class="span3"><label>Subdivision</label><input id="subdivision"></div><div class="span4"><label>Directions</label><textarea id="directions" rows="2"></textarea></div></div></section><section class="sec"><h3>Mailing & Insurance</h3><div class="grid"><div class="span2"><label>Mailing address</label><input id="mailingStreet"></div><div><label>Mailing city</label><input id="mailingCity"></div><div><label>Mailing state</label><input id="mailingState"></div><div><label>Mailing ZIP</label><input id="mailingZip"></div><div><label>Insurance related?</label><select id="insuranceRelated"><option value=""></option><option>No</option><option>Yes</option></select></div><div class="span2"><label>Insurance company</label><input id="insuranceCompany"></div></div></section><section class="sec"><h3>Roof / Home Information</h3><div class="grid"><div><label>Shingle age</label><input id="shingleAge"></div><div class="span2"><label>When do they hope to have work done?</label><input id="desiredWorkTiming"></div><div><label>Layers</label><select id="roofLayers"><option></option><option>1</option><option>2</option><option>Unknown</option></select></div><div><label>Any leaks now?</label><select id="currentLeak"><option></option><option>No</option><option>Yes</option></select></div><div class="span3"><label>If yes, where?</label><input id="currentLeakLocation"></div><div><label>Has it ever leaked?</label><select id="priorLeak"><option></option><option>No</option><option>Yes</option></select></div><div class="span3"><label>If yes, where?</label><input id="priorLeakLocation"></div><div><label>Type of home</label><select id="homeType"><option></option><option>1-story</option><option>2-story</option><option>Other</option></select></div><div><label>Roof pitch / slope</label><select id="roofPitch"><option></option><option>Walk</option><option>Steep</option><option>Unknown</option></select></div><div><label>Payment</label><select id="paymentPlan"><option></option><option>Cash</option><option>Financing</option><option>Insurance</option><option>Unknown</option></select></div></div></section><section class="sec"><h3>Source & Work Requested</h3><div class="grid"><div class="span2"><label>Lead source</label><input id="source"></div><div class="span2"><label>Source detail</label><input id="sourceSecondary"></div><div><label>Work category</label><input id="workCategory" value="Roofing"></div><div class="span3"><label>Product interest / work requested</label><input id="productInterest"></div><div class="span4"><label>Product description</label><input id="productDescription"></div><div class="span4"><label>Notes</label><textarea id="notes" rows="4"></textarea></div></div></section><div class="actions"><button class="btn primary" type="submit" id="saveBtn">Save Contact + Inquiry</button><a class="btn" href="contacts.html">Cancel</a><span id="status" class="status"></span></div></form></main><script src="new-inquiry.js?v=20260911-51-test"></script></body></html>
