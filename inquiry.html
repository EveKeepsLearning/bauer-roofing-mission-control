<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inquiry • Bauer Roofing Operations</title><link rel="stylesheet" href="styles.css?v=20260909-6"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260909-6"></script><style>body{background:#f3f6f9}.shell{width:min(1100px,94vw);margin:24px auto 60px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.card2{background:#fff;border:1px solid #dfe5ec;border-radius:14px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.appt{border:1px solid #e1e7ee;border-radius:10px;padding:12px;margin:8px 0;cursor:pointer;background:#fbfcfd}.appt:hover{background:#f4f8fd}.appt-grid{display:grid;grid-template-columns:180px 1fr 160px;gap:12px}.toolbar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.empty{text-align:center;color:#687588;padding:24px}@media(max-width:760px){.head,.grid,.appt-grid{display:block}.wide{grid-column:auto}}</style></head><body><main class="shell"><div class="head"><div><h1 id="title">Inquiry</h1><div class="sub" id="subtitle"></div></div><div class="toolbar2"><button class="btn" id="backBtn" type="button">Back to Contact</button><button class="btn" id="jobBtn" type="button" style="display:none">Open Job</button></div></div><div id="notice" class="notice hidden"></div><section class="card2"><div class="grid"><div><label>Inquiry number</label><input id="leadNumber"></div><div><label>Inquiry date/time</label><input id="inquiryAt" type="datetime-local"></div><div><label>Inquiry taken by</label><input id="takenBy"></div><div><label>Assigned to</label><input id="assignedTo"></div><div><label>Lead source primary</label><input id="source"></div><div><label>Lead source secondary</label><input id="sourceSecondary"></div><div><label>Product interest</label><input id="productInterest" placeholder="Roofing (Asphalt), Metal Roofing, Repairs, Windows..."></div><div><label>Product description</label><input id="productDescription"></div><div><label>Work category</label><input id="workCategory"></div><div><label>Phone</label><input id="phone"></div><div><label>Email</label><input id="email"></div><div class="wide"><label>Property address</label><input id="address"></div><div><label>City</label><input id="city"></div><div><label>State</label><input id="state"></div><div><label>ZIP</label><input id="zip"></div><div class="wide"><label>Notes</label><textarea id="notes" rows="5"></textarea></div></div><div class="toolbar" style="margin-top:16px"><button class="btn primary" id="saveInquiryBtn" type="button">Save Inquiry</button></div></section><section class="card2"><div class="head"><div><h2 style="margin:0">Appointments</h2><div class="sub">Appointments tied to this inquiry.</div></div><button class="btn primary" id="addAppointmentBtn" type="button">+ Add Appointment</button></div><div id="appointmentList"></div></section></main><dialog id="appointmentDialog"><form method="dialog" class="card" style="min-width:min(700px,92vw)"><h2 id="appointmentTitle">Appointment</h2><input id="appointmentId" type="hidden"><div class="grid"><div><label>Date/time</label><input id="appointmentAt" type="datetime-local"></div><div><label>Assigned to</label><input id="appointmentAssigned"></div><div><label>Appointment type</label><input id="appointmentType"></div><div><label>Result</label><input id="appointmentResult" placeholder="Demo Sold, Estimate Needed, Reschedule..."></div><div class="wide"><label>Result reason / note</label><input id="appointmentResultNote"></div><div class="wide"><label>Notes</label><textarea id="appointmentNotes" rows="4"></textarea></div></div><div class="toolbar"><button class="btn primary" id="saveAppointmentBtn" type="button">Save Appointment</button><button class="btn" value="cancel">Cancel</button></div></form></dialog><script src="inquiry.js?v=20260909-6"></script></body></html>
