name: BRO regression tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test-only dependency
        run: npm install --no-save pdf-lib@1.17.1
      - name: Run JavaScript regression tests
        run: node --test tests/*.test.cjs tests/*.test.mjs
