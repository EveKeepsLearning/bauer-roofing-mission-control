<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{background:#f3f6f9;color:#233b58}.inquiries-shell{width:min(1450px,96vw);margin:26px auto 60px}.directory-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.directory-head h1{font-size:30px;letter-spacing:-.035em;margin:4px 0 8px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:800;color:#4779ad}.sub{color:#63768d}.directory-card{background:white;border:1px solid #dfe7f1;border-top:4px solid #3479cc;border-radius:16px;padding:20px;box-shadow:0 4px 18px #233b580d}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;padding:16px;background:#f6f9fc;border:1px solid #e1e9f2;border-radius:12px}.filters label{font-size:12px;font-weight:700;color:#586e88}.filters input,.filters select{width:100%;margin:6px 0 0;background:white;font-size:14px}.filter-bottom{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin-top:14px}.filter-bottom label{flex:1;min-width:150px}.filter-bottom input,.filter-bottom select{width:100%}.result-bar,.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0}.result-bar strong{color:#1b5ca5}.table-wrap{overflow-x:auto;border:1px solid #e0e8f0;border-radius:12px}table{width:100%;min-width:940px;border-collapse:collapse}th{text-align:left;background:#f0f5fb;color:#5b718b;text-transform:uppercase;font-size:11px;letter-spacing:.06em;padding:14px}td{padding:16px 14px;border-bottom:1px solid #e7edf4;font-size:13px;vertical-align:top;line-height:1.5}tbody tr:nth-child(even){background:#fafcfe}tr[data-href]{cursor:pointer}tr[data-href]:hover{background:#edf5ff;box-shadow:inset 4px 0 #3479cc}tr[data-href]:focus-visible{outline:3px solid #3479cc;outline-offset:-3px}td a{font-weight:800;color:#205f9f;text-decoration:none}.badge{display:inline-block;padding:4px 9px;border-radius:20px;background:#eaf2ff;color:#255b9c;font-size:11px;font-weight:700}.badge.sold{background:#eaf7ef;color:#286444}.badge.closed{background:#f0f1f5;color:#606c7d}.archive{font-size:11px;color:#76538f;margin-top:5px}.empty{padding:38px;text-align:center;color:#65758b}.pager .controls{display:flex;gap:8px;align-items:center}.notice:empty{display:none}#busy{font-size:12px;color:#63768d}@media(max-width:760px){.directory-head{align-items:start;flex-direction:column}.filters{grid-template-columns:1fr}.directory-card{padding:12px}.result-bar,.pager{flex-wrap:wrap}.filter-bottom label{min-width:130px}.directory-head h1{font-size:26px}}
</style></head><body><main class="inquiries-shell">
<header class="directory-head"><div><div class="eyebrow">Bauer Roofing • Inquiry directory</div><h1>All Inquiries</h1><div class="sub">Find any inquiry—open, sold, closed, or archived. Click a row to open it.</div></div><a class="btn" href="sales.html">Sales Pipeline →</a></header>
<section class="directory-card"><form id="filters">
<div class="filters"><label>Search inquiries<input id="query" type="search" placeholder="Inquiry #, customer, property address, phone, or email" autocomplete="off"></label><label>Status<select id="status"><option value="">All statuses</option></select></label><label>Lead source<select id="source"><option value="">All sources</option></select></label></div>
<div class="filter-bottom"><label>From date<input id="from" type="date"></label><label>Through date<input id="to" type="date"></label><label>Records<select id="archive"><option value="all">Include archived</option><option value="current">Not archived</option><option value="archived">Archived only</option></select></label><label>Sort by<select id="sort"><option value="newest">Newest inquiry first</option><option value="oldest">Oldest inquiry first</option><option value="name">Customer name</option></select></label><button class="btn primary" type="submit">Search</button><button id="clear" class="btn" type="button">Clear</button></div></form>
<div class="result-bar"><div id="summary" role="status" aria-live="polite">Loading inquiries…</div><span id="busy"></span></div><div id="notice" class="notice" role="alert"></div>
<div class="table-wrap"><table aria-label="Inquiry search results"><thead><tr><th>Inquiry</th><th>Date</th><th>Customer / property</th><th>Interest</th><th>Status</th><th>Source / assigned</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody></table></div>
<div class="pager"><span class="sub">Existing BRO records · Deleted inquiries are excluded</span><div class="controls"><button id="previous" class="btn" disabled>← Previous</button><span id="pageLabel">Page 1</span><button id="next" class="btn" disabled>Next →</button></div></div></section></main>
<script src="all-inquiries.js?v=20260912-inquiries1"></script><script src="lifecycle-navigation.js?v=20260912-print1"></script></body></html>
