<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bauer Roofing Mission Control - Calendar</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    :root{
      --bg:#f8f9fa;
      --panel:#fff;
      --text:#202124;
      --muted:#5f6368;
      --line:#dadce0;
      --soft-line:#e8eaed;
      --today:#e8f0fe;
      --today-strong:#1a73e8;
      --repair:#4054b2;
      --reroof:#039be5;
      --other:#039be5;
      --warning:#f9ab00;
      --hour-height:64px;
      --header-height:70px;
      --time-width:72px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:var(--bg)}
    button{font:inherit}
    .hidden{display:none!important}

    .topbar{
      position:sticky;top:0;z-index:50;
      background:#fff;border-bottom:1px solid var(--line);
      padding:12px 18px;
      display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    }
    .brand{font-size:20px;font-weight:600;white-space:nowrap}
    .top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .spacer{flex:1}
    .btn{
      border:1px solid var(--line);background:#fff;color:#3c4043;
      border-radius:20px;padding:9px 15px;cursor:pointer;
    }
    .btn:hover{background:#f1f3f4}
    .btn.icon{padding:8px 12px;font-size:18px;line-height:1}
    .btn.primary{background:#1a73e8;color:white;border-color:#1a73e8}
    .period-title{font-size:22px;font-weight:400;min-width:180px}

    .legend{
      background:#fff;border-bottom:1px solid var(--line);
      display:flex;align-items:center;gap:18px;flex-wrap:wrap;
      padding:8px 18px;color:var(--muted);font-size:13px;
    }
    .legend-item{display:flex;align-items:center;gap:7px}
    .dot{width:11px;height:11px;border-radius:3px;display:inline-block}
    .dot.repair{background:var(--repair)}
    .dot.reroof{background:var(--reroof)}
    .review-dot{width:9px;height:9px;background:var(--warning);border-radius:50%;display:inline-block}

    .message{
      margin:14px 18px;padding:12px 14px;border-radius:8px;
      background:#fff3cd;border:1px solid #ffe69c;color:#664d03;
    }

    .calendar-shell{
      height:calc(100vh - 112px);
      min-height:600px;
      overflow:auto;background:#fff;
    }

    .calendar{
      min-width:1100px;
      display:grid;
      grid-template-columns:var(--time-width) repeat(7,minmax(145px,1fr));
      position:relative;
    }

    .corner{
      position:sticky;top:0;left:0;z-index:35;background:#fff;
      border-right:1px solid var(--line);border-bottom:1px solid var(--line);
      height:var(--header-height);
    }

    .day-head{
      position:sticky;top:0;z-index:30;background:#fff;
      height:var(--header-height);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      border-bottom:1px solid var(--line);
    }
    .day-head.today{background:#f8fbff}
    .day-name{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px}
    .day-number{
      margin-top:6px;width:38px;height:38px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;font-size:24px;
    }
    .day-head.today .day-number{background:var(--today-strong);color:#fff}

    .time-col{
      position:sticky;left:0;z-index:15;background:#fff;border-right:1px solid var(--line);
    }
    .time-slot{
      height:var(--hour-height);position:relative;border-bottom:1px solid transparent;
      color:var(--muted);font-size:11px;text-align:right;padding-right:9px;
    }
    .time-slot span{position:relative;top:-7px;background:#fff;padding-left:4px}

    .day-col{
      position:relative;border-right:1px solid var(--line);
      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent calc(var(--hour-height) - 1px),
          var(--soft-line) calc(var(--hour-height) - 1px),
          var(--soft-line) var(--hour-height)
        );
    }
    .day-col.today{background-color:#fbfdff}

    .event{
      position:absolute;left:4px;right:4px;
      border-radius:5px;padding:5px 7px;
      color:#fff;font-size:12px;line-height:1.25;
      overflow:hidden;cursor:pointer;
      border-left:3px solid rgba(255,255,255,.55);
      box-shadow:0 1px 2px rgba(0,0,0,.12);
    }
    .event:hover{filter:brightness(.96)}
    .event.repair{background:var(--repair)}
    .event.reroof{background:var(--reroof)}
    .event.other{background:var(--other)}
    .event-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .event-time{opacity:.95;margin-top:2px}
    .event-contact{opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .event .review-dot{position:absolute;right:5px;top:5px;border:1px solid rgba(255,255,255,.8)}

    .now-line{
      position:absolute;height:2px;background:#ea4335;left:0;right:0;z-index:10;pointer-events:none;
    }
    .now-line:before{
      content:"";position:absolute;width:8px;height:8px;background:#ea4335;border-radius:50%;
      left:-4px;top:-3px;
    }

    dialog{
      border:0;border-radius:12px;padding:0;max-width:min(560px,92vw);
      width:560px;box-shadow:0 18px 50px rgba(0,0,0,.22);
    }
    dialog::backdrop{background:rgba(32,33,36,.35)}
    .dialog-card{padding:22px}
    .dialog-card h2{margin:0 0 5px;font-size:20px}
    .dialog-sub{color:var(--muted);margin-bottom:18px}
    .detail-grid{display:grid;grid-template-columns:145px 1fr;gap:9px 14px;font-size:14px}
    .detail-label{color:var(--muted)}
    .dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}

    .empty-state{
      padding:50px;text-align:center;color:var(--muted);background:#fff;
    }

    @media(max-width:700px){
      .brand{font-size:17px}
      .period-title{font-size:18px;min-width:auto}
      .calendar-shell{height:calc(100vh - 150px)}
    }
  </style>
</head>
<body>

  <div id="authMessage" class="message hidden"></div>

  <div id="calendarApp" class="hidden">
    <div class="topbar">
      <div class="brand">Bauer Roofing Mission Control</div>

      <div class="top-actions">
        <a class="btn" href="index.html" style="text-decoration:none">Mission Control</a>
        <button class="btn" id="todayBtn">Today</button>
        <button class="btn icon" id="prevBtn" aria-label="Previous week">‹</button>
        <button class="btn icon" id="nextBtn" aria-label="Next week">›</button>
      </div>

      <div class="period-title" id="periodTitle">Calendar</div>

      <div class="spacer"></div>

      <button class="btn" id="refreshBtn">Refresh</button>
    </div>

    <div class="legend">
      <span class="legend-item"><span class="dot repair"></span> Repair appointment</span>
      <span class="legend-item"><span class="dot reroof"></span> Reroof / measure / presentation</span>
      <span class="legend-item"><span class="review-dot"></span> Needs review</span>
      <span class="legend-item">Read-only from Google Calendar</span>
    </div>

    <div class="calendar-shell" id="calendarShell">
      <div class="calendar" id="calendarGrid"></div>
    </div>
  </div>

  <dialog id="eventDialog">
    <div class="dialog-card">
      <h2 id="detailTitle"></h2>
      <div class="dialog-sub" id="detailWhen"></div>

      <div class="detail-grid" id="detailGrid"></div>

      <div class="dialog-actions">
        <button class="btn" id="closeDialogBtn">Close</button>
      </div>
    </div>
  </dialog>

<script>
'use strict';

const cfg = window.BAUER_CONFIG || {};
const TZ = 'America/New_York';
const START_HOUR = 6;
const END_HOUR = 20;
const HOUR_HEIGHT = 64;

let db = null;
let weekStart = startOfWeek(new Date());
let events = [];

const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

function startOfWeek(date){
  const d = new Date(date);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() - d.getDay());
  return d;
}

function addDays(date,days){
  const d = new Date(date);
  d.setDate(d.getDate()+days);
  return d;
}

function localDateKey(date){
  return new Intl.DateTimeFormat('en-CA',{
    timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'
  }).format(date);
}

function displayDate(date, opts){
  return new Intl.DateTimeFormat('en-US',{timeZone:TZ,...opts}).format(date);
}

function timeText(date){
  return displayDate(date,{hour:'numeric',minute:'2-digit'});
}

function monthRangeTitle(){
  const end = addDays(weekStart,6);
  const sameMonth = weekStart.getMonth() === end.getMonth();
  const sameYear = weekStart.getFullYear() === end.getFullYear();

  if(sameMonth){
    return displayDate(weekStart,{month:'long',year:'numeric'});
  }
  if(sameYear){
    return displayDate(weekStart,{month:'short'}) + ' - ' +
      displayDate(end,{month:'short',year:'numeric'});
  }
  return displayDate(weekStart,{month:'short',year:'numeric'}) + ' - ' +
    displayDate(end,{month:'short',year:'numeric'});
}

function eventClass(row){
  if(row.appointment_code === 'F' || row.appointment_type === 'Repair') return 'repair';
  if(['M','P'].includes(row.appointment_code)) return 'reroof';
  return 'other';
}

function eventContact(row){
  return [row.contact_last_name,row.contact_first_name].filter(Boolean).join(', ');
}

function minuteOfDay(date){
  const parts = new Intl.DateTimeFormat('en-US',{
    timeZone:TZ,hour12:false,hour:'2-digit',minute:'2-digit'
  }).formatToParts(date);
  const hour = Number(parts.find(p=>p.type==='hour')?.value || 0);
  const minute = Number(parts.find(p=>p.type==='minute')?.value || 0);
  return hour*60 + minute;
}

function showMessage(text){
  $('authMessage').textContent = text;
  $('authMessage').classList.remove('hidden');
}

async function init(){
  if(!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY){
    showMessage('Mission Control config.js could not be found.');
    return;
  }

  db = supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);

  const {data:{session}} = await db.auth.getSession();

  if(!session?.user){
    showMessage('Please sign in to Mission Control first, then open Calendar again.');
    return;
  }

  $('calendarApp').classList.remove('hidden');
  await loadWeek();
}

async function loadWeek(){
  $('periodTitle').textContent = monthRangeTitle();

  const start = new Date(weekStart);
  const end = addDays(weekStart,7);

  const {data,error} = await db
    .from('calendar_events')
    .select('*')
    .gte('start_at',start.toISOString())
    .lt('start_at',end.toISOString())
    .order('start_at',{ascending:true});

  if(error){
    showMessage('Calendar could not load: ' + error.message);
    return;
  }

  $('authMessage').classList.add('hidden');
  events = data || [];
  renderCalendar();

  requestAnimationFrame(()=>{
    const shell = $('calendarShell');
    const desired = Math.max(0,(8-START_HOUR)*HOUR_HEIGHT - 30);
    shell.scrollTop = desired;
  });
}

function renderCalendar(){
  const grid = $('calendarGrid');
  grid.innerHTML = '';

  const corner = document.createElement('div');
  corner.className = 'corner';
  grid.appendChild(corner);

  const todayKey = localDateKey(new Date());

  for(let i=0;i<7;i++){
    const day = addDays(weekStart,i);
    const key = localDateKey(day);
    const head = document.createElement('div');
    head.className = 'day-head' + (key===todayKey ? ' today' : '');
    head.innerHTML =
      '<div class="day-name">'+esc(displayDate(day,{weekday:'short'}))+'</div>'+
      '<div class="day-number">'+esc(displayDate(day,{day:'numeric'}))+'</div>';
    grid.appendChild(head);
  }

  const timeCol = document.createElement('div');
  timeCol.className='time-col';

  for(let h=START_HOUR;h<END_HOUR;h++){
    const slot=document.createElement('div');
    slot.className='time-slot';
    const sample=new Date(2026,0,1,h,0,0);
    slot.innerHTML='<span>'+esc(new Intl.DateTimeFormat('en-US',{hour:'numeric'}).format(sample))+'</span>';
    timeCol.appendChild(slot);
  }
  grid.appendChild(timeCol);

  for(let dayIndex=0;dayIndex<7;dayIndex++){
    const day=addDays(weekStart,dayIndex);
    const key=localDateKey(day);
    const col=document.createElement('div');
    col.className='day-col' + (key===todayKey ? ' today' : '');
    col.style.height=((END_HOUR-START_HOUR)*HOUR_HEIGHT)+'px';

    const dayEvents=events.filter(row=>localDateKey(new Date(row.start_at))===key);

    dayEvents.forEach(row=>{
      const start=new Date(row.start_at);
      const end=new Date(row.end_at);
      const startMinutes=minuteOfDay(start);
      const endMinutes=minuteOfDay(end);

      const top=((startMinutes-START_HOUR*60)/60)*HOUR_HEIGHT;
      const height=Math.max(28,((endMinutes-startMinutes)/60)*HOUR_HEIGHT);

      if(top+height<0 || top>((END_HOUR-START_HOUR)*HOUR_HEIGHT)) return;

      const el=document.createElement('div');
      el.className='event '+eventClass(row);
      el.style.top=Math.max(0,top)+'px';
      el.style.height=Math.min(height,((END_HOUR-START_HOUR)*HOUR_HEIGHT)-Math.max(0,top))+'px';

      const contact=eventContact(row);
      el.innerHTML=
        '<div class="event-title">'+esc(row.summary || 'Calendar event')+'</div>'+
        '<div class="event-time">'+esc(timeText(start))+' - '+esc(timeText(end))+'</div>'+
        (contact ? '<div class="event-contact">'+esc(contact)+'</div>' : '')+
        (row.calendar_classification==='Needs Review' ? '<span class="review-dot" title="Needs review"></span>' : '');

      el.addEventListener('click',()=>openDetails(row));
      col.appendChild(el);
    });

    if(key===todayKey){
      const now=new Date();
      const mins=minuteOfDay(now);
      if(mins>=START_HOUR*60 && mins<=END_HOUR*60){
        const line=document.createElement('div');
        line.className='now-line';
        line.style.top=(((mins-START_HOUR*60)/60)*HOUR_HEIGHT)+'px';
        col.appendChild(line);
      }
    }

    grid.appendChild(col);
  }
}

function openDetails(row){
  const start=new Date(row.start_at);
  const end=new Date(row.end_at);

  $('detailTitle').textContent=row.summary || 'Calendar event';
  $('detailWhen').textContent=
    displayDate(start,{weekday:'long',month:'long',day:'numeric',year:'numeric'})+
    ' • '+timeText(start)+' - '+timeText(end);

  const fields=[
    ['Classification',row.calendar_classification],
    ['Lead source',row.source_label || row.source_code],
    ['Appointment type',row.appointment_type || row.appointment_code],
    ['Property',row.property_text],
    ['Homeowner',eventContact(row)],
    ['Primary phone',row.phone_primary],
    ['Secondary phone',row.phone_secondary],
    ['Email',row.email],
    ['Description',row.description],
    ['Google calendar',row.calendar_name]
  ].filter(([,value])=>value);

  $('detailGrid').innerHTML=fields.map(([label,value])=>
    '<div class="detail-label">'+esc(label)+'</div><div>'+esc(value)+'</div>'
  ).join('');

  $('eventDialog').showModal();
}

$('todayBtn').onclick=async()=>{
  weekStart=startOfWeek(new Date());
  await loadWeek();
};
$('prevBtn').onclick=async()=>{
  weekStart=addDays(weekStart,-7);
  await loadWeek();
};
$('nextBtn').onclick=async()=>{
  weekStart=addDays(weekStart,7);
  await loadWeek();
};
$('refreshBtn').onclick=loadWeek;
$('closeDialogBtn').onclick=()=>$('eventDialog').close();

init();
</script>
</body>
</html>
